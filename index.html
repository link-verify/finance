<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceFlow AI - Smart Bill Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-purple: #bc13fe;
            --neon-blue: #00f2ff;
            --neon-pink: #ff00de;
            --dark-bg: #0a0a0c;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(188, 19, 254, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 255, 0.05) 0%, transparent 40%);
            color: #e2e8f0;
            min-height: 100vh;
        }
        .neon-card {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            transition: all 0.3s ease;
        }
        .floating-form {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 380px;
            max-width: calc(100vw - 4rem);
            transform: translateY(150%);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }
        .floating-form.active { transform: translateY(0); }
        .fab-button {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            box-shadow: 0 0 25px rgba(188, 19, 254, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 110;
        }
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .scanner-line {
            width: 100%;
            height: 2px;
            background: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            position: absolute;
            animation: scan 2s infinite linear;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body class="p-4 md:p-8 pb-24">

    <!-- Loading UI -->
    <div id="loading-ui" class="loading-overlay">
        <div class="relative w-48 h-48 border-2 border-dashed border-[#00f2ff] rounded-lg overflow-hidden mb-4">
            <div class="scanner-line"></div>
            <div class="absolute inset-0 flex items-center justify-center opacity-20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 text-[#00f2ff]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                </svg>
            </div>
        </div>
        <p class="text-[#00f2ff] font-bold tracking-widest text-xs animate-pulse">AI SEDANG MEMINDAI STRUK...</p>
    </div>

    <div class="max-w-6xl mx-auto">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-4xl font-black italic text-transparent bg-clip-text bg-gradient-to-r from-[#bc13fe] to-[#00f2ff]">
                    FINANCE<span class="text-white">FLOW</span><span class="text-xs ml-2 text-cyan-500 font-bold tracking-tighter uppercase">AI</span>
                </h1>
                <p class="text-gray-500 font-light tracking-[0.3em] uppercase text-[10px]">Smart Ledger v3.0</p>
            </div>
            
            <div class="flex items-center gap-3">
                <!-- AI Bill Scanner -->
                <button onclick="document.getElementById('bill-upload').click()" class="neon-card px-4 py-3 border border-[#bc13fe]/30 text-[#bc13fe] text-[10px] font-bold uppercase tracking-widest hover:bg-[#bc13fe]/10 transition-all flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    Scan Struk
                </button>
                <input type="file" id="bill-upload" accept="image/*" class="hidden" onchange="processBill(event)">

                <button onclick="document.getElementById('excel-input').click()" class="neon-card px-4 py-3 border border-[#00f2ff]/30 text-[#00f2ff] text-[10px] font-bold uppercase tracking-widest hover:bg-[#00f2ff]/10 transition-all flex items-center gap-2">
                    Excel
                </button>
                <input type="file" id="excel-input" accept=".xlsx, .xls" class="hidden" onchange="handleExcelUpload(event)">
                
                <div class="neon-card px-6 py-2 border-l-4 border-l-[#00f2ff]">
                    <p class="text-[10px] text-gray-500 uppercase">Saldo</p>
                    <h2 id="total-balance" class="text-xl font-bold text-white">Rp 0</h2>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-8 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="neon-card p-6 md:col-span-2">
                    <h3 class="text-xs font-bold mb-4 text-gray-400 uppercase tracking-widest">Tren Saldo</h3>
                    <div style="height: 250px;"><canvas id="lineChart"></canvas></div>
                </div>
                <div class="neon-card p-6">
                    <h3 class="text-xs font-bold mb-4 text-gray-400 uppercase tracking-widest">Kategori</h3>
                    <div style="height: 200px;"><canvas id="doughnutChart"></canvas></div>
                </div>
                <div class="neon-card p-6">
                    <h3 class="text-xs font-bold mb-4 text-gray-400 uppercase tracking-widest">In vs Out</h3>
                    <div style="height: 200px;"><canvas id="barChart"></canvas></div>
                </div>
            </div>

            <div class="lg:col-span-4">
                <div class="neon-card p-6 h-full flex flex-col">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Riwayat</h3>
                        <div class="flex gap-2">
                            <button onclick="downloadTemplate()" class="text-[9px] text-[#00f2ff] hover:underline uppercase font-bold">Tpl</button>
                            <button onclick="clearAll()" class="text-[9px] text-red-400 uppercase font-bold">Clear</button>
                        </div>
                    </div>
                    <div id="transaction-list" class="space-y-4 flex-grow overflow-y-auto max-h-[600px] pr-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Form -->
    <div id="fab" class="fab-button" onclick="toggleForm()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
    </div>

    <div id="floating-form" class="floating-form neon-card p-8 shadow-2xl border-2 border-[#bc13fe]">
        <h3 class="text-xl font-bold text-white mb-6">Tambah Transaksi</h3>
        <form id="finance-form" class="space-y-4">
            <input type="text" id="desc" placeholder="Keterangan" class="w-full bg-black/60 p-3 rounded-xl border border-gray-800 text-white outline-none focus:border-[#00f2ff]" required>
            <input type="number" id="amount" placeholder="Nominal" class="w-full bg-black/60 p-3 rounded-xl border border-gray-800 text-white outline-none focus:border-[#00f2ff]" required>
            <div class="flex gap-2">
                <button type="button" onclick="setType('income')" id="btn-income" class="flex-1 py-2 rounded-lg border text-[10px] font-black">INCOME</button>
                <button type="button" onclick="setType('expense')" id="btn-expense" class="flex-1 py-2 rounded-lg border text-[10px] font-black">EXPENSE</button>
            </div>
            <select id="category" class="w-full bg-black/60 p-3 rounded-xl border border-gray-800 text-white">
                <option value="Makanan">Makanan</option>
                <option value="Transport">Transport</option>
                <option value="Hiburan">Hiburan</option>
                <option value="Gaji">Gaji</option>
                <option value="Belanja">Belanja</option>
                <option value="Lainnya">Lainnya</option>
            </select>
            <button type="submit" class="w-full bg-gradient-to-r from-[#bc13fe] to-[#00f2ff] py-3 rounded-xl font-bold uppercase text-xs">Simpan</button>
        </form>
    </div>

    <script>
        const apiKey = ""; // Diset secara otomatis oleh lingkungan
        let transactions = JSON.parse(localStorage.getItem('transactions_v3')) || [];
        let selectedType = 'expense';
        let charts = {};

        async function processBill(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('loading-ui').style.display = 'flex';
            
            try {
                const base64Image = await fileToBase64(file);
                const imageData = base64Image.split(',')[1];

                const prompt = `Analisa gambar struk/nota ini. Ekstrak data dalam format JSON: { "keterangan": string, "nominal": number, "kategori": "Makanan"|"Transport"|"Hiburan"|"Belanja"|"Lainnya", "tipe": "expense" }. Jika ini bukan struk pengeluaran, sesuaikan tipenya. Pastikan nominal berupa angka murni tanpa titik/koma ribuan.`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inlineData: { mimeType: file.type, data: imageData } }
                            ]
                        }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const result = await response.json();
                const aiData = JSON.parse(result.candidates[0].content.parts[0].text);

                // Auto-fill form
                document.getElementById('desc').value = aiData.keterangan;
                document.getElementById('amount').value = aiData.nominal;
                document.getElementById('category').value = aiData.kategori;
                setType(aiData.tipe || 'expense');
                
                document.getElementById('loading-ui').style.display = 'none';
                toggleForm();
                
            } catch (error) {
                console.error(error);
                alert("Gagal memproses struk. Pastikan gambar jelas.");
                document.getElementById('loading-ui').style.display = 'none';
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function toggleForm() {
            document.getElementById('floating-form').classList.toggle('active');
        }

        function setType(type) {
            selectedType = type;
            const btnInc = document.getElementById('btn-income');
            const btnExp = document.getElementById('btn-expense');
            if(type === 'income') {
                btnInc.className = "flex-1 py-2 rounded-lg border-cyan-500 bg-cyan-500/20 text-cyan-400 text-[10px] font-black";
                btnExp.className = "flex-1 py-2 rounded-lg border-gray-800 text-gray-600 text-[10px] font-black";
            } else {
                btnExp.className = "flex-1 py-2 rounded-lg border-pink-500 bg-pink-500/20 text-pink-400 text-[10px] font-black";
                btnInc.className = "flex-1 py-2 rounded-lg border-gray-800 text-gray-600 text-[10px] font-black";
            }
        }

        function updateUI() {
            const list = document.getElementById('transaction-list');
            list.innerHTML = '';
            let inc = 0, exp = 0;

            transactions.forEach((t, i) => {
                t.type === 'income' ? inc += t.amount : exp += t.amount;
                const div = document.createElement('div');
                div.className = `p-3 bg-white/5 rounded-xl border-l-2 ${t.type === 'income' ? 'border-cyan-500' : 'border-pink-500'} flex justify-between items-center`;
                div.innerHTML = `
                    <div>
                        <p class="text-xs font-bold">${t.desc}</p>
                        <p class="text-[8px] text-gray-500 uppercase">${t.category} • ${t.date}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-mono font-bold ${t.type === 'income' ? 'text-cyan-400' : 'text-pink-400'}">
                            ${t.type === 'income' ? '+' : '-'}${t.amount.toLocaleString('id-ID')}
                        </span>
                        <button onclick="deleteT(${i})" class="text-gray-700 hover:text-red-500">×</button>
                    </div>
                `;
                list.appendChild(div);
            });

            document.getElementById('total-balance').innerText = "Rp " + (inc - exp).toLocaleString('id-ID');
            updateCharts(inc, exp);
            localStorage.setItem('transactions_v3', JSON.stringify(transactions));
        }

        function updateCharts(inc, exp) {
            // Logic chart (sama dengan versi sebelumnya, disingkat untuk efisiensi)
            const ctxBar = document.getElementById('barChart').getContext('2d');
            if(charts.bar) charts.bar.destroy();
            charts.bar = new Chart(ctxBar, {
                type: 'bar',
                data: { labels: ['In', 'Out'], datasets: [{ data: [inc, exp], backgroundColor: ['#00f2ff', '#ff00de'], borderRadius: 5 }] },
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            const expByCat = transactions.filter(t => t.type === 'expense').reduce((acc, c) => {
                acc[c.category] = (acc[c.category] || 0) + c.amount; return acc;
            }, {});
            const ctxDoughnut = document.getElementById('doughnutChart').getContext('2d');
            if(charts.doughnut) charts.doughnut.destroy();
            charts.doughnut = new Chart(ctxDoughnut, {
                type: 'doughnut',
                data: { labels: Object.keys(expByCat), datasets: [{ data: Object.values(expByCat), backgroundColor: ['#bc13fe', '#00f2ff', '#ff00de', '#f59e0b'] }] },
                options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 8 } } } } }
            });

            let bal = 0;
            const lineData = [...transactions].reverse().map(t => { bal += (t.type === 'income' ? t.amount : -t.amount); return bal; });
            const ctxLine = document.getElementById('lineChart').getContext('2d');
            if(charts.line) charts.line.destroy();
            charts.line = new Chart(ctxLine, {
                type: 'line',
                data: { labels: lineData.map((_, i) => i), datasets: [{ data: lineData, borderColor: '#bc13fe', tension: 0.4, fill: true, backgroundColor: 'rgba(188,19,254,0.1)' }] },
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function deleteT(i) { transactions.splice(i, 1); updateUI(); }
        function clearAll() { if(confirm('Hapus semua?')) { transactions = []; updateUI(); } }

        document.getElementById('finance-form').addEventListener('submit', (e) => {
            e.preventDefault();
            transactions.unshift({
                desc: document.getElementById('desc').value,
                amount: parseFloat(document.getElementById('amount').value),
                category: document.getElementById('category').value,
                type: selectedType,
                date: new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short' })
            });
            e.target.reset();
            toggleForm();
            updateUI();
        });

        setType('expense');
        updateUI();
    </script>
</body>
</html>
